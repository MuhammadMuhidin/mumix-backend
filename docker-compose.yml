version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mumix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mumix
      POSTGRES_PASSWORD: mumix_secret
      POSTGRES_DB: mumix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mumix"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: mumix-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://mumix:***@db:5432/mumix_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
